name: Build and deploy to Hostinger

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER" || { echo "::error::FTP_SERVER repository secret is missing."; exit 1; }
          test -n "$FTP_USERNAME" || { echo "::error::FTP_USERNAME repository secret is missing."; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "::error::FTP_PASSWORD repository secret is missing."; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "::error::FTP_SERVER_DIR repository secret is missing."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
